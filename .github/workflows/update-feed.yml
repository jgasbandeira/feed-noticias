name: Atualizar feed de notícias

on:
  schedule:
    # A cada 30 minutos. O GitHub Actions não garante o minuto exato (pode
    # atrasar alguns minutos em horários de pico), mas roda com essa cadência.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar agregador
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python build_feed.py

      - name: Publicar mudanças
        run: |
          git config user.name "news-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/items.json docs/index.html
          git diff --quiet --cached || git commit -m "Atualiza feed [skip ci]"
          git push
